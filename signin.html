<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="todo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="body">
    <main class="reg1">
        <img class="img2" src="images/signimage.png" alt="a woman and a screen">
        <article class="reg2">
            <h2 class="h2">Sign In</h2>
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" name="username" placeholder="Enter Username">
            </div>
            <br>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Enter Password">
            </div>
            <br>
            <div>
                <label class="agree">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Remember Me</span>
                </label>
            </div>
            <br>
            <div class="reg" onclick="window.location.href='index.html'">Login</div>
            <br><br>
            <p class="agree">Or, Login with
                <span class="socialicons">
                <i class="fa-brands fa-facebook" id="fb"></i>
                <i class="fa-brands fa-google gg" id="google"></i>
                <i class="fa-brands fa-x-twitter xt" id="x"></i>
                </span>
            </p>
            <p class="agree">Don't have an account? <a class="sin">Create One</a></p>
        </article>

    </main>

</body>

</html>
